<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go</title>
<style>
:root {
  --bg:#10151f;
  --panel:#171d29;
  --ink:#f2f3f5;
  --muted:#aab2bf;
  --personal:#6fa287;
  --pro:#c97d4b;
  --blue:#4d8fff;
}
* {
  box-sizing:border-box;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:20px 18px 60px;
}
main {
  max-width:760px;
  margin:auto;
}
h1 {
  margin:0 0 6px;
  font-size:2rem;
}
.tagline {
  color:var(--muted);
  margin:0 0 28px;
  line-height:1.5;
}
.card {
  width:100%;
  text-align:left;
  background:var(--panel);
  color:var(--ink);
  border:0;
  border-left:5px solid;
  border-radius:16px;
  padding:22px;
  margin-bottom:18px;
  font-size:1rem;
}
.card.personal {
  border-left-color:var(--personal);
}
.card.pro {
  border-left-color:var(--pro);
}
.card-title {
  display:block;
  font-size:1.35rem;
  font-weight:700;
  margin-bottom:8px;
}
.card-text {
  display:block;
  color:var(--muted);
  line-height:1.5;
}
button,
textarea {
  font:inherit;
}
.action {
  width:100%;
  min-height:58px;
  border:0;
  border-radius:12px;
  padding:15px;
  margin:8px 0;
  font-weight:700;
  font-size:1.05rem;
}
.home-button {
  background:#293345;
  color:var(--ink);
  border:2px solid #657086;
  margin-bottom:22px;
}
.primary {
  background:var(--personal);
  color:#07120d;
}
.secondary {
  background:#293345;
  color:var(--ink);
}
.send {
  background:var(--blue);
  color:white;
}
textarea {
  width:100%;
  min-height:110px;
  background:#0c1119;
  color:var(--ink);
  border:2px solid #404b60;
  border-radius:12px;
  padding:14px;
  margin:8px 0 10px;
  resize:vertical;
}
label {
  display:block;
  font-weight:700;
  margin-top:20px;
}
.screen {
  display:none;
}
.screen.active {
  display:block;
}
#photoPreview {
  width:100%;
  max-height:420px;
  object-fit:contain;
  border-radius:12px;
  margin:14px 0;
  display:none;
}
#status {
  margin:16px 0;
  color:var(--muted);
  min-height:24px;
}
.result {
  background:var(--panel);
  border-left:5px solid var(--personal);
  border-radius:12px;
  padding:16px;
  margin-top:14px;
}
.result h3 {
  margin:0 0 8px;
}
.notice {
  background:var(--panel);
  border-radius:12px;
  padding:16px;
  color:var(--muted);
  margin:16px 0;
}
input[type="file"] {
  display:none;
}
</style>
</head>
<body>
<main>
<section id="home" class="screen active" aria-labelledby="homeTitle">
  <h1 id="homeTitle" tabindex="-1">Know N'Go</h1>
  <p class="tagline">
    Your personal AI concierge. Ask. See. Know. Go.
  </p>
<span class="card-title">
  Personal Concierge
</span>
<span class="card-text">
  Ask questions, take or upload a photo, and get help understanding what is around you.
</span>
  </button>
<span class="card-title">
  Professional Concierge
</span>
