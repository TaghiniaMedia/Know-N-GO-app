<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go Personal</title>

<style>
:root {
  --bg:#10151f;
  --panel:#171d29;
  --ink:#f2f3f5;
  --muted:#aab2bf;
  --green:#6fa287;
  --blue:#4d8fff;
  --orange:#c97d4b;
  --danger:#ff7b7b;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:24px 18px 60px;
}

main {
  max-width:760px;
  margin:auto;
}

.home {
  display:block;
  width:100%;
  min-height:56px;
  padding:16px;
  margin-bottom:32px;
  border-radius:12px;
  background:var(--panel);
  color:var(--ink);
  font-size:1.05rem;
  font-weight:700;
  text-decoration:none;
  text-align:center;
}

h1 {
  margin:0 0 10px;
  font-size:2rem;
}

.subtitle {
  color:var(--muted);
  line-height:1.6;
  margin:0 0 36px;
}

.control-group {
  margin-bottom:34px;
}

label {
  display:block;
  font-weight:700;
  margin-bottom:12px;
  font-size:1.05rem;
}

input[type="text"] {
  width:100%;
  min-height:58px;
  padding:17px;
  font-size:1.05rem;
  border-radius:12px;
  border:1px solid #444;
  background:var(--panel);
  color:var(--ink);
}

button {
  width:100%;
  min-height:62px;
  padding:18px;
  border:0;
  border-radius:12px;
  font-size:1.08rem;
  font-weight:700;
  cursor:pointer;
}

.action-button {
  margin-bottom:28px;
}

.take {
  background:var(--green);
  color:white;
}

.choose {
  background:var(--orange);
  color:white;
}

.describe {
  background:var(--blue);
  color:white;
  margin-top:12px;
}

.describe:disabled {
  background:#343b47;
  color:#9299a5;
}

input[type="file"] {
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

#previewArea {
  display:none;
  margin:6px 0 34px;
}

#preview {
  width:100%;
  max-height:420px;
  object-fit:contain;
  border-radius:12px;
}

#selectedPhotoText {
  margin:12px 0 0;
  color:var(--muted);
}

#status {
  min-height:28px;
  color:var(--muted);
  margin:28px 0;
  line-height:1.5;
}

#results {
  margin-top:32px;
}

.result {
  background:var(--panel);
  border-left:5px solid var(--green);
  border-radius:10px;
  padding:18px;
  margin-bottom:24px;
}

.result.hazard {
  border-left-color:var(--danger);
}

.result.closer {
  border-left-color:var(--orange);
}

.result.suggestion {
  border-left-color:var(--blue);
}

.result h2 {
  margin:0 0 10px;
  font-size:1.15rem;
}

.result p {
  margin:0;
  line-height:1.6;
}
