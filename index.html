<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go</title>

<style>
:root {
  --bg:#10151f;
  --panel:#171d29;
  --ink:#f2f3f5;
  --muted:#aab2bf;
  --personal:#6fa287;
  --pro:#c97d4b;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:32px 20px 60px;
}

main {
  max-width:760px;
  margin:auto;
}

h1 {
  text-align:center;
  margin:0 0 8px;
  font-size:2.2rem;
}

.tagline {
  text-align:center;
  color:var(--muted);
  margin:0 0 36px;
  font-size:1.05rem;
}

.card {
  display:block;
  text-decoration:none;
  color:var(--ink);
  background:var(--panel);
  border-radius:18px;
  padding:26px 22px;
  margin-bottom:20px;
  border-left:6px solid;
}

.personal {
  border-color:var(--personal);
}

.pro {
  border-color:var(--pro);
}

.card h2 {
  margin:0 0 10px;
  font-size:1.5rem;
}

.card p {
  margin:0;
  color:var(--muted);
  line-height:1.5;
  font-size:1rem;
}

.open {
  display:block;
  margin-top:18px;
  font-weight:700;
}

.personal .open {
  color:var(--personal);
}

.pro .open {
  color:var(--pro);
}
</style>
</head>

<body>
<main>

<h1>Know N'Go</h1>
<p class="tagline">Your personal guide for everyday life.</p>

<a class="card personal" href="vision-engine.html" aria-label="Open Personal">
  <h2>Personal</h2>
  <p>Ask a question, take or upload a photo, and get help with what is in front of you.</p>
  <span class="open">Open Personal →</span>
</a>

<a class="card pro" href="pro-dashboard.html" aria-label="Open Professional">
  <h2>Professional</h2>
  <p>Tools for business, work, clients, documents, and everyday professional tasks.</p>
  <span class="open">Open Professional →</span>
</a>

</main>
</body>
</html>
