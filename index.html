<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go Personal</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 24px 18px 60px;
  background: #10151f;
  color: #f2f3f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main {
  max-width: 760px;
  margin: auto;
}
h1 {
  margin-bottom: 8px;
}
p {
  line-height: 1.5;
}
button,
input,
label {
  font-size: 18px;
}
.action {
  display: block;
  width: 100%;
  padding: 18px;
  margin: 14px 0;
  border: 0;
  border-radius: 14px;
  font-weight: 700;
}
#file-input {
  position: absolute;
  left: -9999px;
}
.photo-button {
  background: #6fa287;
  color: #ffffff;
  text-align: center;
  cursor: pointer;
}
#question {
  width: 100%;
  padding: 18px;
  margin-top: 14px;
  border-radius: 12px;
  border: 1px solid #777;
  background: #ffffff;
  color: #111111;
}
#ask-button {
  background: #4d8fff;
  color: #ffffff;
}
#ask-button:disabled {
  opacity: 0.5;
}
#photo-preview {
  display: none;
  width: 100%;
  max-height: 360px;
  object-fit: contain;
  margin-top: 18px;
  border-radius: 12px;
}
#status {
  margin-top: 18px;
  font-weight: 600;
}
#results {
  margin-top: 24px;
  padding: 18px;
  background: #171d29;
  border-radius: 14px;
}
.result-section {
  margin-bottom: 20px;
}
.result-section h2 {
  font-size: 20px;
  margin-bottom: 6px;
}
.home-link {
  display: inline-block;
  margin-bottom: 20px;
  color: #ffffff;
  font-size: 18px;
}
</style>
</head>
<body>
<main>
<a class="home-link" href="index.html" aria-label="Back to Know N'Go home">
Back to Home
</a>
<h1>Personal</h1>
<p>
Take or choose a photo and Know N'Go will help describe what is in front of you.
You can also ask a specific question about the photo.
</p>

<input
type=“file”
id=“file-input”
accept=“image/*”
capture=“environment”
aria-label=“Take or choose a photo”

<label for=“file-input” class=“action photo-button
