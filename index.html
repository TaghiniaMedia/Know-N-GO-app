<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go Personal</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 28px 20px 60px;
  background: #ffffff;
  color: #111111;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 22px;
}

main {
  max-width: 760px;
  margin: 0 auto;
}

h1 {
  font-size: 38px;
  margin: 0 0 36px;
}

button,
input {
  font: inherit;
}

.action {
  display: block;
  width: 100%;
  min-height: 68px;
  margin: 0 0 32px;
  padding: 16px;
  border: 2px solid #111111;
  border-radius: 12px;
  background: #ffffff;
  color: #111111;
}

.action:focus,
#question:focus {
  outline: 4px solid #111111;
  outline-offset: 3px;
}

#fileInput {
  display: none;
}

#preview {
  display: none;
  width: 100%;
  height: auto;
  margin: 0 0 32px;
  border-radius: 12px;
}

#questionForm {
  margin-top: 10px;
}

#question {
  display: block;
  width: 100%;
  min-height: 68px;
  margin: 0 0 24px;
  padding: 16px;
  border: 2px solid #111111;
  border-radius: 12px;
  background: #ffffff;
  color: #111111;
}

#askButton {
  font-weight: 700;
}

#status {
  min-height: 32px;
  margin-top: 28px;
  font-weight: 600;
}

#answer {
  margin-top: 24px;
  line-height: 1.6;
  white-space: pre-wrap;
}
</style>
</head>

<body>
<main>
  <h1>Know N'Go Personal</h1>

  <button class="action" id="photoButton" type="button">
    Take or Choose Photo
  </button>

  <input
    id="fileInput"
    type="file"
    accept="image/*"
    capture="environment"
    aria-label="Take or choose photo"
  >

  <img id="preview" alt="Selected photo preview">

  <form id="questionForm">
    <input
      id="question"
      type="text"
      placeholder="Ask a question"
      aria-label="Ask a question"
      autocomplete="off"
    >

    <button class="action" id="askButton" type="submit">
      Ask Question
    </button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <div id="answer" role="region" aria-label="Answer" aria-live="polite"></div>
</main>

<script>
const BACKEND_URL =
  "https://see-and-say-server-1.onrender.com/describe";

const photoButton = document.getElementById("photoButton");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const questionForm = document.getElementById("questionForm");
const questionInput = document.getElementById("question");
const askButton = document.getElementById("askButton");
const status = document.getElementById("status");
const answer = document.getElementById("answer");

let selectedImage = null;
let selectedMediaType = null;

photoButton.addEventListener("click", function () {
  fileInput.click();
});

fileInput.addEventListener("change", function () {
  const file = fileInput.files && fileInput.files[0];

  if (!file) {
    return;
  }

  selectedMediaType = file.type || "image/jpeg";

  const reader = new FileReader();

  reader.onload = function () {
    const dataUrl = reader.result;

    selectedImage = dataUrl.split(",")[1];

    preview.src = dataUrl;
    preview.style.display = "block";

    status.textContent =
      "Photo ready. Ask a question or press Ask Question for a description.";
  };

  reader.onerror = function () {
    status.textContent = "The photo could not be loaded.";
  };

  reader.readAsDataURL(file);
});

questionForm.addEventListener("submit", function (event) {
  event.preventDefault();
  sendRequest();
});

async function sendRequest() {
  const question = questionInput.value.trim();

  if (!question && !selectedImage) {
    status.textContent = "Type a question or choose a photo first.";
    questionInput.focus();
    return;
  }

  askButton.disabled = true;
  questionInput.disabled = true;
  answer.textContent = "";
  status.textContent = "Thinking...";

  try {
    const response = await fetch(BACKEND_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: question || null,
        image: selectedImage || null,
        mediaType: selectedMediaType || null
      })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("The server returned an invalid response.");
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        "The server returned an error."
      );
    }

    const result = buildAnswer(data);

    answer.textContent = result;
    status.textContent = "Answer ready.";

    answer.setAttribute("tabindex", "-1");
    answer.focus();
  } catch (error) {
    console.error(error);
    status.textContent =
      error.message || "Unable to connect to Know N'Go. Please try again.";
  } finally {
    askButton.disabled = false;
    questionInput.disabled = false;
  }
}

function buildAnswer(data) {
  if (typeof data === "string") {
    return data;
  }

  if (data.answer) {
    return data.answer;
  }

  if (data.response) {
    return data.response;
  }

  if (data.message) {
    return data.message;
  }

  if (data.description) {
    return data.description;
  }

  const parts = [];

  if (data.confident) {
    parts.push(data.confident);
  }

  if (data.whatICanSee) {
    parts.push(data.whatICanSee);
  }

  if (data.seeing) {
    parts.push(data.seeing);
  }

  if (
    data.hazard &&
    data.hazard !== "Nothing hazardous spotted"
  ) {
    parts.push("Hazard: " + data.hazard);
  }

  if (
    data.needs_closer_photo &&
    data.needs_closer_photo !== "Nothing — the photo is clear"
  ) {
    parts.push(
      "Needs a closer photo: " + data.needs_closer_photo
    );
  }

  if (data.needsCloserPhoto) {
    parts.push(
      "Needs a closer photo: " + data.needsCloserPhoto
    );
  }

  if (data.suggestion) {
    parts.push(data.suggestion);
  }

  if (data.error) {
    return data.error;
  }

  if (parts.length > 0) {
    return parts.join("\n\n");
  }

  return "No answer was returned.";
}
</script>
</body>
</html>
