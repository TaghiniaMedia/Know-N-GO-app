<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go - Personal Concierge</title>

<style>
:root {
  --bg:#10151f;
  --panel:#171d29;
  --ink:#f2f3f5;
  --muted:#aab2bf;
  --green:#6fa287;
  --blue:#4d8fff;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:28px 18px 60px;
}

main {
  max-width:760px;
  margin:auto;
}

h1 {
  font-size:38px;
  margin:0 0 8px;
}

.subtitle {
  color:var(--muted);
  font-size:20px;
  line-height:1.5;
  margin-bottom:30px;
}

label {
  display:block;
  font-size:19px;
  margin-bottom:8px;
}

input[type="text"] {
  width:100%;
  background:var(--panel);
  color:var(--ink);
  border:2px solid var(--green);
  border-radius:12px;
  padding:16px;
  font-size:20px;
  margin-bottom:20px;
}

button {
  width:100%;
  min-height:60px;
  border:none;
  border-radius:12px;
  font-size:20px;
  font-weight:700;
  padding:15px;
  margin-bottom:16px;
  cursor:pointer;
}

#takePhotoBtn {
  background:var(--green);
  color:white;
}

#askBtn {
  background:var(--blue);
  color:white;
}

#askBtn:disabled {
  opacity:.5;
}

input[type="file"] {
  display:none;
}

#preview {
  width:100%;
  border-radius:12px;
  display:none;
  margin-bottom:18px;
}
