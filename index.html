<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go</title>

<style>
:root {
  --bg:#10151f;
  --panel:#171d29;
  --ink:#f2f3f5;
  --muted:#aab2bf;
  --personal:#6fa287;
  --pro:#c97d4b;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:32px 20px 60px;
}

main {
  max-width:720px;
  margin:auto;
}

header {
  text-align:center;
  margin-bottom:42px;
}

h1 {
  font-size:40px;
  margin:0 0 10px;
}

.subtitle {
  color:var(--muted);
  font-size:19px;
  line-height:1.5;
}

.options {
  display:flex;
  flex-direction:column;
  gap:32px;
}

.card {
  display:block;
  text-decoration:none;
  color:var(--ink);
  background:var(--panel);
  border-radius:22px;
  padding:32px 24px;
  min-height:150px;
}

.card:focus {
  outline:4px solid white;
  outline-offset:4px;
}

.personal {
  border:3px solid var(--personal);
}

.pro {
  border:3px solid var(--pro);
}

.card h2 {
  font-size:30px;
  margin:0 0 12px;
}

.card p {
  color:var(--muted);
  font-size:18px;
  line-height:1.5;
  margin:0;
}

footer {
  margin-top:48px;
  text-align:center;
  color:var(--muted);
  font-size:15px;
}
</style>
</head>

<body>

<main>

<header>
  <h1>Know N'Go</h1>
  <div class="subtitle">
    Your accessible AI concierge.
  </div>
</header>

<nav class="options" aria-label="Choose your Know N'Go experience">

  <a
    class="card personal"
    href="vision-engine.html"
    aria-label="Personal. Open Know N'Go Personal."
  >
    <h2>Personal</h2>
    <p>
      Everyday help when you need it. Ask questions, use your camera, upload information, and get clear answers.
    </p>
  </a>

  <a
    class="card pro"
    href="pro-dashboard.html"
    aria-label="Pro. Open Know N'Go Pro."
  >
    <h2>Pro</h2>
    <p>
      Powerful assistance for work, business, organization, and productivity.
    </p>
  </a>

</nav>

<footer>
  Know N'Go by Zeus Enterprises
</footer>

</main>

</body>
</html>
