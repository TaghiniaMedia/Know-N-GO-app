<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go</title>

<style>
:root {
  --bg:#10151f;
  --panel:#171d29;
  --ink:#f2f3f5;
  --muted:#aab2bf;
  --personal:#6fa287;
  --pro:#c97d4b;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:28px 18px 60px;
}

main {
  max-width:760px;
  margin:auto;
}

h1 {
  margin:0 0 6px;
  font-size:46px;
  line-height:1.05;
}

.tagline {
  color:var(--muted);
  font-size:23px;
  line-height:1.5;
  margin:12px 0 48px;
}

.card {
  display:block;
  text-decoration:none;
  color:var(--ink);
  background:var(--panel);
  border-radius:18px;
  padding:24px;
  margin-bottom:22px;
  border:3px solid transparent;
}

.card.personal {
  border-color:var(--personal);
}

.card.pro {
  border-color:var(--pro);
}

.card h2 {
  margin:0 0 12px;
  font-size:31px;
}

.card p {
  margin:0;
  color:var(--muted);
  font-size:21px;
  line-height:1.5;
}

.card:focus {
  outline:4px solid white;
  outline-offset:4px;
}
</style>
</head>

<body>
<main>

<h1>Know N'Go</h1>

<p class="tagline">
Your personal AI concierge. Ask. See. Know. Go.
</p>

<a class="card personal" href="vision-engine.html" aria-label="Personal Concierge">
  <h2>Personal Concierge</h2>
  <p>
    Ask questions, take or upload a photo, and get help understanding what is around you.
  </p>
</a>

<a class="card pro" href="pro-dashboard.html" aria-label="Professional Concierge">
  <h2>Professional Concierge</h2>
  <p>
    Get AI-powered help for business, work, organization, and productivity.
  </p>
</a>

</main>
</body>
</html>
