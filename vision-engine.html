<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go Personal</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 28px 20px 60px;
  background: #ffffff;
  color: #111111;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 20px;
}

main {
  max-width: 760px;
  margin: 0 auto;
}

h1 {
  font-size: 36px;
  margin: 0 0 32px;
}

button,
input {
  font: inherit;
}

.action {
  display: block;
  width: 100%;
  min-height: 64px;
  margin: 0 0 30px;
  padding: 16px;
  border: 2px solid #111111;
  border-radius: 14px;
  background: #ffffff;
  color: #111111;
  font-weight: 700;
  text-align: center;
}

#photoInput {
  position: absolute;
  left: -9999px;
}

#question {
  width: 100%;
  min-height: 64px;
  margin: 0 0 30px;
  padding: 18px;
  border: 2px solid #555555;
  border-radius: 14px;
  background: #ffffff;
  color: #111111;
  font-size: 22px;
}

#question:focus,
.action:focus {
  outline: 4px solid #005fcc;
  outline-offset: 3px;
}

#preview {
  display: none;
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  margin: 0 0 30px;
  border-radius: 14px;
}

#status {
  margin: 28px 0;
  font-weight: 700;
}

#answer {
  display: none;
  margin-top: 30px;
  padding: 22px;
  border: 2px solid #222222;
  border-radius: 14px;
  font-size: 22px;
  line-height: 1.6;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<main>
  <h1>Know N'Go Personal</h1>

  <label class="action" for="photoInput">
    Take or Choose a Photo
  </label>

  <input
    id="photoInput"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <img id="preview" alt="Selected photo">

  <input
    id="question"
    type="text"
    aria-label="Ask a question"
    placeholder="Type your question here"
    autocomplete="off"
  >

  <button class="action" id="askButton" type="button">
    Ask Question
  </button>

  <div id="status" role="status" aria-live="polite"></div>

  <div
    id="answer"
    tabindex="-1"
    aria-live="polite"
  ></div>
</main>

<script>
const API_URL = "https://see-and-say-server-1.onrender.com/describe";

const photoInput = document.getElementById("photoInput");
const preview = document.getElementById("preview");
const question = document.getElementById("question");
const askButton = document.getElementById("askButton");
const status = document.getElementById("status");
const answer = document.getElementById("answer");

let selectedImageBase64 = null;

photoInput.addEventListener("change", function () {
  const file = photoInput.files[0];

  if (!file) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function () {
    selectedImageBase64 = reader.result.split(",")[1];
    preview.src = reader.result;
    preview.style.display = "block";
    status.textContent = "Photo ready.";
  };

  reader.readAsDataURL(file);
});

question.addEventListener("keydown", function (event) {
  if (event.key === "Enter") {
    event.preventDefault();
    submitQuestion();
  }
});

askButton.addEventListener("click", submitQuestion);

  const userQuestion = question.value.trim();

  if (!userQuestion && !selectedImageBase64) {
    status.textContent = "Type a question or choose a photo.";
    return;
  }

  askButton.disabled = true;
  status.textContent = "Getting your answer...";
  answer.style.display = "none";
  answer.textContent = "";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        image: selectedImageBase64,
        question: userQuestion || null
      })
    });

    if (!response.ok) {
      throw new Error("Server error");
    }

    const data = await response.json();

    let result = "";

    if (typeof data === "string") {
      result = data;

    } else if (data.text) {
      result = data.text;

      if (data.whatICanSee) {
        parts.push(data.whatICanSee);
      }
