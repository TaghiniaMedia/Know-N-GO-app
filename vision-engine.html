<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go Personal</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:24px 18px 60px;
  background:#10151f;
  color:#f2f3f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
main{
  max-width:760px;
  margin:auto;
}
h1{margin:0 0 8px}
p{line-height:1.5}
.section{
  margin-top:34px;
}
button,
input,
textarea{
  width:100%;
  font-size:18px;
  border-radius:12px;
}
button{
  min-height:58px;
  border:0;
  padding:14px;
  background:#6fa287;
  color:white;
  font-weight:700;
  margin-top:18px;
}
input,
textarea{
  background:#171d29;
  color:white;
  border:1px solid #3a4352;
  padding:14px;
  margin-top:12px;
}
textarea{
  min-height:120px;
  resize:vertical;
}
#preview{
  display:none;
  width:100%;
  max-height:350px;
  object-fit:contain;
  margin-top:18px;
  border-radius:12px;
}
#status,
#answer{
  margin-top:20px;
  line-height:1.5;
}
#answer{
  padding:16px;
  background:#171d29;
  border-radius:12px;
}
.hidden{
  position:absolute;
  left:-9999px;
}
</style>
</head>
<body>

<main>
<h1>Know N'Go Personal</h1>
<p>Take or choose a photo, then ask what you want to know.</p>

<div class="section">
<button id="cameraButton" type="button">Take a Photo</button>

<button id="libraryButton" type="button">Choose a Photo</button>

<input
  id="cameraInput"
  class="hidden"
  type="file"
  accept="image/*"
  capture="environment"
  aria-label="Take a photo">

<input
  id="libraryInput"
  class="hidden"
  type="file"
  accept="image/*"
  aria-label="Choose a photo from library">

<img id="preview" alt="Selected image preview">
</div>

<div class="section">
<label for="question">What would you like to know?</label>
<textarea
  id="question"
  placeholder="Example: What is in this picture?"></textarea>

<button id="askButton" type="button">Ask Know N'Go</button>
</div>

<p id="status" role="status" aria-live="polite"></p>

<div id="answer" role="region" aria-live="polite" aria-label="Know N'Go answer">
Your answer will appear here.
</div>

</main>

<script>
const cameraButton = document.getElementById("cameraButton");
const libraryButton = document.getElementById("libraryButton");
const cameraInput = document.getElementById("cameraInput");
const libraryInput = document.getElementById("libraryInput");
const preview = document.getElementById("preview");
const question = document.getElementById("question");
const askButton = document.getElementById("askButton");
const status = document.getElementById("status");
const answer = document.getElementById("answer");

let selectedFile = null;

cameraButton.addEventListener("click", () => cameraInput.click());
libraryButton.addEventListener("click", () => libraryInput.click());

cameraInput.addEventListener("change", handleFile);
libraryInput.addEventListener("change", handleFile);

function handleFile(event){
  const file = event.target.files[0];
  if(!file) return;

  selectedFile = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  status.textContent = "Photo selected.";
}

askButton.addEventListener("click", async () => {
  const userQuestion = question.value.trim();

  if(!selectedFile && !userQuestion){
    status.textContent = "Add a photo or type a question first.";
    return;
  }

  askButton.disabled = true;
  status.textContent = "Working...";
  answer.textContent = "";

  try{
    const formData = new FormData();

    if(selectedFile){
      formData.append("image", selectedFile);
    }

    formData.append(
      "question",
      userQuestion || "Describe this image clearly and helpfully."
    );

    const response = await fetch(
      "https://know-n-go.onrender.com/analyze",
      {
        method:"POST",
        body:formData
      }
    );

    if(!response.ok){
      throw new Error("Server error " + response.status);
    }

    const data = await response.json();

    const result =
      data.answer ||
      data.response ||
      data.result ||
      data.message ||
      "I received the request, but no answer was returned.";

    answer.textContent = result;
    status.textContent = "Done.";

  }catch(error){
    answer.textContent =
      "Know N'Go could not connect to the server. The server connection still needs to be activated.";
    status.textContent = "Connection failed.";
    console.error(error);

  }finally{
    askButton.disabled = false;
  }
});
</script>

</body>
</html>
