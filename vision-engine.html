<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Know N'Go Personal</title>

<style>
:root {
  color-scheme: dark;
  --background: #10151f;
  --panel: #192231;
  --border: #344258;
  --text: #ffffff;
  --muted: #c8d0dc;
  --blue: #1687ff;
  --blue-dark: #006edc;
  --red: #ff6868;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 28px 18px 60px;
  background: var(--background);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 18px;
}

main {
  width: 100%;
  max-width: 720px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 12px;
  font-size: 34px;
}

.introduction {
  margin: 0 0 34px;
  color: var(--muted);
  line-height: 1.55;
}

.section {
  margin-bottom: 34px;
  padding: 22px;
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 18px;
}

.section h2 {
  margin: 0 0 18px;
  font-size: 24px;
}

.file-button,
.primary-button,
.secondary-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 62px;
  padding: 14px 18px;
  border-radius: 14px;
  font-size: 20px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
}

.file-button,
.primary-button {
  color: #ffffff;
  background: var(--blue);
  border: 3px solid transparent;
}

.file-button:active,
.primary-button:active {
  background: var(--blue-dark);
}

.secondary-button {
  margin-top: 20px;
  color: #ffffff;
  background: transparent;
  border: 3px solid var(--border);
}

button:focus,
label:focus,
textarea:focus {
  outline: 4px solid #ffffff;
  outline-offset: 4px;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

input[type="file"] {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
}

#previewArea {
  display: none;
  margin-top: 24px;
}

#photoPreview {
  display: block;
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  border: 2px solid var(--border);
  border-radius: 14px;
}

#photoName {
  margin: 14px 0 0;
  color: var(--muted);
  overflow-wrap: anywhere;
}

textarea {
  width: 100%;
  min-height: 140px;
  padding: 16px;
  resize: vertical;
  color: var(--text);
  background: #0d121
