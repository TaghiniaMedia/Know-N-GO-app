<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go Personal</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #10151f;
  --panel: #171d28;
  --panel2: #202836;
  --text: #f4f6f8;
  --muted: #c7ccd4;
  --accent: #67b7ff;
  --good: #7ee2a8;
  --warn: #ffd27a;
  --border: #394354;
}

body {
  margin: 0;
  padding: 32px 20px 80px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 18px;
}

main {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

h1 {
  font-size: 36px;
  margin: 0 0 18px;
}

.intro {
  color: var(--muted);
  line-height: 1.6;
  margin: 0 0 42px;
}

.action-section {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 42px;
}

.action-section h2 {
  margin: 0 0 14px;
  font-size: 25px;
}

.action-section p {
  color: var(--muted);
  line-height: 1.5;
  margin: 0 0 24px;
}

button {
  display: block;
  width: 100%;
  min-height: 64px;
  padding: 16px 18px;
  border-radius: 14px;
  border: none;
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
}

button:focus,
textarea:focus {
  outline: 4px solid white;
  outline-offset: 3px;
}

.primary-button {
  background: var(--accent);
  color: #06131f;
}

.secondary-button {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
}

.danger-button {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

#photoInput {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
}

#photoPreview {
  display: none;
  max-width: 100%;
  border-radius: 14px;
  margin: 28px 0;
}

#photoStatus {
  min-height: 28px;
  margin: 24px 0;
  color: var(--muted);
  line-height: 1.5;
}

#removePhotoBtn {
  margin-top: 26px;
}

.question-label {
  display: block;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 14px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 150px;
  resize: vertical;
  padding: 18px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
  font-family: inherit;
  font-size: 19px;
  line-height: 1.5;
  margin-bottom: 28px;
}

textarea::placeholder {
  color: #aeb5c0;
}

#askQuestionBtn {
  margin-top: 10px;
}

#describePhotoBtn {
  margin-top: 28px;
}

#status {
  min-height: 30px;
  color: var(--muted);
  margin: 32px 0 20px;
  line-height: 1.5;
}

#results {
  margin-top: 34px;
}

.result {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 28px;
}

.result h2 {
  margin: 0 0 12px;
  font-size: 21px;
}

.result p {
  margin: 0;
  line-height: 1.6;
}

.confident h2 {
  color: var(--good);
}

.warning h2 {
  color: var(--warn);
}
