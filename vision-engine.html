<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go Personal</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 28px 18px 60px;
  background: #10151f;
  color: #f2f3f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 12px;
  font-size: 38px;
}

.intro {
  margin: 0 0 40px;
  font-size: 22px;
  line-height: 1.5;
  color: #d7dce5;
}

.action {
  display: block;
  width: 100%;
  min-height: 72px;
  margin-bottom: 34px;
  padding: 18px;
  border: 0;
  border-radius: 16px;
  background: #ffffff;
  color: #10151f;
  font-family: inherit;
  font-size: 22px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
}

.action:focus,
textarea:focus {
  outline: 4px solid #ffffff;
  outline-offset: 4px;
}

.file-input {
  position: fixed;
  left: -10000px;
  width: 1px;
  height: 1px;
  opacity: 0;
}

#preview {
  display: none;
  width: 100%;
  max-height: 400px;
  margin-bottom: 28px;
  object-fit: contain;
  border-radius: 16px;
}

.question-area {
  margin-top: 48px;
}

textarea {
  display: block;
  width: 100%;
  min-height: 150px;
  margin-bottom: 28px;
  padding: 18px;
  border: 2px solid #d7dbe2;
  border-radius: 16px;
  background: #ffffff;
  color: #10151f;
  font-family: inherit;
  font-size: 22px;
  line-height: 1.5;
  resize: vertical;
}

#status {
  margin: 30px 0;
  font-size: 20px;
  line-height: 1.5;
}

#result {
  display: none;
  margin-top: 34px;
  padding: 24px;
  border-radius: 16px;
  background: #ffffff;
  color: #10151f;
  font-size: 22px;
  line-height: 1.6;
  white-space: pre-wrap;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
</style>
</head>

<body>

<main>

<h1>Know N'Go Personal</h1>

<p class="intro">
Take a photo, upload one, or ask Know N'Go anything.
</p>

<button
  id="cameraButton"
  class="action"
  type="button"
>
Take a Photo
</button>

<input
  id="cameraInput"
  class="file-input"
  type="file"
  accept="image/*"
  capture="environment"
  tabindex="-1"
  aria-hidden="true"
>

<button
  id="uploadButton"
  class="action"
  type="button"
>
Upload a Photo
</button>
