<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go Personal</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 28px 18px 80px;
  background: #10151f;
  color: #f2f3f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 10px;
  font-size: 32px;
  line-height: 1.2;
}

.subtitle {
  margin: 0 0 42px;
  color: #aeb7c5;
  font-size: 18px;
  line-height: 1.5;
}

.section {
  margin-bottom: 34px;
}

button,
input {
  width: 100%;
  min-height: 62px;
  border-radius: 14px;
  font-size: 18px;
  font-family: inherit;
}

button {
  border: none;
  padding: 16px 18px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  background: #78ac90;
  color: #07130d;
}

.secondary {
  background: #263245;
  color: #ffffff;
  border: 2px solid #75839a;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

input {
  padding: 14px 16px;
  border: 2px solid #75839a;
  background: #151d29;
  color: #ffffff;
}

input::placeholder {
  color: #adb5c2;
}

label {
  display: block;
  margin-bottom: 12px;
  font-size: 19px;
  font-weight: 700;
}

#photoInput,
#cameraInput {
  position: absolute;
  left: -10000px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

#status {
  min-height: 28px;
  margin: 22px 0 30px;
  color: #d4dae3;
  font-size: 17px;
  line-height: 1.5;
}

#preview {
  display: none;
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  margin-top: 24px;
  border-radius: 14px;
}

#results {
  display: none;
  margin-top: 38px;
  padding: 24px 20px;
  background: #171f2c;
  border-radius: 16px;
  line-height: 1.6;
}

.result-block {
  margin-bottom: 28px;
}

.result-block:last-child {
  margin-bottom: 0;
}

.result-block h2 {
  margin: 0 0 10px;
  font-size: 21px;
}

.result-block p {
  margin: 0;
  font-size: 18px;
  white-space: pre-wrap;
}

.spacer {
  height: 16px;
}
</style>
</head>

<body>

<main>
  <h1>Know N'Go Personal</h1>

  <p class="subtitle">
    Snap or choose a photo, ask a question, and get a clear answer.
  </p>

  <div class="section">
    <button
      id="choosePhotoBtn"
      class="primary"
      type="button"
      aria-label="Choose an existing photo"
    >
      Choose Photo
    </button>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      aria-hidden="true"
      tabindex="-1"
    >

    <div class="spacer"></div>

    <button
      id="takePhotoBtn"
      class="secondary"
      type="button"
      aria-label="Take a new photo with the camera"
    >
      Take Photo
    </button>

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      aria-hidden="true"
      tabindex="-1"
    >

    <img id="preview" alt="Selected photo preview">
  </div>

  <div class="section">
    <label for="question">
      What would you like to know?
    </label>

    <input
      id="question"
      type="text"
      autocomplete="off"
      placeholder="Example: What is this?"
      aria-describedby="questionHelp"
    >

    <p id="questionHelp" style="position:absolute;left:-10000px;">
      Asking a question is optional. If left blank, Know N'Go will describe the photo.
    </p>
  </div>

  <div
    id="status"
    role="status"
    aria-live="polite"
    aria-atomic="true"
  >
    Choose or take a photo to begin.
  </div>

  <div class="section">
    <button
      id="describeBtn"
      class="primary"
      type="button"
      disabled
      aria-disabled="true"
    >
      Describe This
    </button>
  </div>

  <div
    id="results"
    aria-live="polite"
    aria-atomic="true"
    tabindex="-1"
  >
    <div
      id="descriptionBlock"
      class="result-block"
      hidden
    >
      <h2>What I can see</h2>
      <p id="description"></p>
    </div>

    <div
      id="answerBlock"
      class="result-block"
      hidden
    >
      <h2>Answer</h2>
      <p id="answer"></p>
    </div>

    <div
      id="warningBlock"
      class="result-block"
      hidden
    >
      <h2>Heads up</h2>
      <p id="warning"></p>
    </div>

    <div
      id="closerBlock"
      class="result-block"
      hidden
    >
      <h2>Needs a closer photo</h2>
      <p id="closer"></p>
    </div>

    <div
      id="suggestionBlock"
      class="result-block"
      hidden
    >
      <h2>Suggestion</h2>
      <p id="suggestion"></p>
    </div>
  </div>
</main>

<script>
const API_URL = "https://see-and-say-server.onrender.com/describe";

const choosePhotoBtn = document.getElementById("choosePhotoBtn");
const takePhotoBtn = document.getElementById("takePhotoBtn");
const photoInput = document.getElementById("photoInput");
const cameraInput = document.getElementById("cameraInput");
const questionInput = document.getElementById("question");
const describeBtn = document.getElementById("describeBtn");
const status = document.getElementById("status");
const preview = document.getElementById("preview");
const results = document.getElementById("results");

let selectedImageBase64 = "";
let selectedMediaType = "";

choosePhotoBtn.addEventListener("click", () => {
  photoInput.value = "";
  photoInput.click();
});

takePhotoBtn.addEventListener("click", () => {
  cameraInput.value = "";
  cameraInput.click();
});

photoInput.addEventListener("change", handlePhotoSelection);
cameraInput.addEventListener("change", handlePhotoSelection);

async function handlePhotoSelection(event) {
  const file = event.target.files && event.target.files[0];

  if (!file) {
    status.textContent = "No photo was selected.";
    return;
  }

  if (!file.type.startsWith("image/")) {
    status.textContent = "Please choose an image file.";
    return;
  }

  status.textContent = "Preparing your photo.";

  try {
    selectedMediaType = file.type || "image/jpeg";

    const dataURL = await fileToDataURL(file);

    selectedImageBase64 = dataURL.split(",")[1];

    preview.src = dataURL;
    preview.style.display = "block";

    describeBtn.disabled = false;
    describeBtn.setAttribute("aria-disabled", "false");

    clearResults();

    status.textContent =
      "Photo ready. Ask a question if you want, then double-tap Describe This.";

  } catch (error) {
    selectedImageBase64 = "";
    selectedMediaType = "";

    describeBtn.disabled = true;
    describeBtn.setAttribute("aria-disabled", "true");

    status.textContent =
      "I could not prepare that photo. Please choose another one.";
  }
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);

    reader.readAsDataURL(file);
  });
}

describeBtn.addEventListener("click", describePhoto);

questionInput.addEventListener("keydown", event => {
  if (
    event.key === "Enter" &&
    selectedImageBase64 &&
    !describeBtn.disabled
  ) {
    event.preventDefault();
    describePhoto();
  }
});

async function describePhoto() {
  if (!selectedImageBase64) {
    status.textContent = "Please choose or take a photo first.";
    return;
  }

  describeBtn.disabled = true;
  describeBtn.setAttribute("aria-disabled", "true");

  choosePhotoBtn.disabled = true;
  takePhotoBtn.disabled = true;

  clearResults();

  status.textContent = "Looking at your photo. Please wait.";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        image: selectedImageBase64,
        mediaType: selectedMediaType,
        question: questionInput.value.trim() || null
      })
    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("The server returned an unreadable response.");
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        data.message ||
        "Know N'Go could not analyze the photo."
      );
    }

    showResults(data);

    status.textContent = "Done.";

  } catch (error) {
    results.style.display = "none";

    status.textContent =
      error.message ||
      "Know N'Go could not analyze the photo. Please try again.";

  } finally {
    describeBtn.disabled = false;
    describeBtn.setAttribute("aria-disabled", "false");

    choosePhotoBtn.disabled = false;
    takePhotoBtn.disabled = false;
  }
}

function showResults(data) {
  clearResults();

  const description =
    data.description ||
    data.whatICanSee ||
    data.seeing ||
    data.result ||
    "";

  const answer =
    data.answer ||
    "";

  const warning =
    data.warning ||
    data.headsUp ||
    "";

  let closer = "";

  if (typeof data.needsCloserPhoto === "string") {
    closer = data.needsCloserPhoto;
  } else if (data.needsCloserPhoto === true) {
    closer = "A closer photo may help me give you a more accurate answer.";
  } else if (typeof data.closerPhoto === "string") {
    closer = data.closerPhoto;
  } else if (typeof data.closer === "string") {
    closer = data.closer;
  }

  const suggestion =
    data.suggestion ||
    "";

  setResult(
    "descriptionBlock",
    "description",
    description
  );

  setResult(
    "answerBlock",
    "answer",
    answer
  );

  setResult(
    "warningBlock",
    "warning",
    warning
  );

  setResult(
    "closerBlock",
    "closer",
    closer
  );

  setResult(
    "suggestionBlock",
    "suggestion",
    suggestion
  );

  if (
    !description &&
    !answer &&
    !warning &&
    !closer &&
    !suggestion
  ) {
    setResult(
      "descriptionBlock",
      "description",
      "I received a response, but there was no description to display."
    );
  }

  results.style.display = "block";
  results.focus();

  const spokenText = [
    description,
    answer,
    warning,
    closer,
    suggestion
  ]
    .filter(Boolean)
    .join(". ");

  speak(spokenText);
}

function setResult(blockId, textId, value) {
  const block = document.getElementById(blockId);
  const text = document.getElementById(textId);

  if (value) {
    text.textContent = value;
    block.hidden = false;
  } else {
    text.textContent = "";
    block.hidden = true;
  }
}

function clearResults() {
  results.style.display = "none";

  [
    "descriptionBlock",
    "answerBlock",
    "warningBlock",
    "closerBlock",
    "suggestionBlock"
  ].forEach(id => {
    document.getElementById(id).hidden = true;
  });

  [
    "description",
    "answer",
    "warning",
    "closer",
    "suggestion"
  ].forEach(id => {
    document.getElementById(id).textContent = "";
  });
}

function speak(text) {
  if (!text || !("speechSynthesis" in window)) {
    return;
  }

  try {
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.95;

    window.speechSynthesis.speak(utterance);
  } catch (error) {
  }
}
</script>

</body>
</html>
