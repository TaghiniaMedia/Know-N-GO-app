<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>See &amp; Say</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0d0d0d;
    color: #f5f5f5;
    margin: 0;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  p.subtitle {
    color: #aaa;
    margin-top: 0;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
  }
  input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    font-size: 1rem;
    border-radius: 8px;
    border: 1px solid #444;
    background: #1a1a1a;
    color: #fff;
    margin-bottom: 20px;
  }
  button {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 1.1rem;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    margin-bottom: 16px;
    cursor: pointer;
  }
  #takePhotoBtn {
    background: #4caf50;
    color: #fff;
  }
  #askBtn {
    background: #2e7dff;
    color: #fff;
  }
  #askBtn:disabled {
    background: #333;
    color: #888;
  }
  #preview {
    width: 100%;
    border-radius: 10px;
    margin-bottom: 16px;
    display: none;
  }
  .result-block {
    background: #1a1a1a;
    border-left: 4px solid #4caf50;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .result-block.needs-closer {
    border-left-color: #ffb300;
  }
  .result-block.suggestion {
    border-left-color: #2e7dff;
  }
  .result-block h2 {
    font-size: 1rem;
    margin: 0 0 6px;
  }
  .result-block p {
    margin: 0;
    line-height: 1.5;
  }
  #status {
    font-style: italic;
    color: #aaa;
    margin-bottom: 16px;
  }
  #results {
    margin-top: 12px;
  }
  input[type="file"] {
    display: none;
  }
</style>
</head>
<body>

<h1>See &amp; Say</h1>
<p class="subtitle">Point your camera at something and get a clear description read aloud.</p>

<label for="question">Optional question (e.g. "what is this?" or "is this expired?")</label>
<input type="text" id="question" placeholder="Leave blank for a general description" />

<button id="takePhotoBtn">Take or Choose Photo</button>
<input type="file" id="fileInput" accept="image/*" capture="environment" />

<img id="preview" alt="Selected photo preview" />

<button id="askBtn" disabled>Describe This</button>

<div id="status" aria-live="polite"></div>
<div id="results" aria-live="polite"></div>

<script>
  // Backend URL — the Render web service that holds the Claude API key and prompt.
  const BACKEND_URL = "https://see-and-say-server-1.onrender.com/describe";

  const takePhotoBtn = document.getElementById("takePhotoBtn");
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const askBtn = document.getElementById("askBtn");
  const questionInput = document.getElementById("question");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");

  let selectedImageBase64 = null;

  takePhotoBtn.addEventListener("click", () => {
    fileInput.click();
  });

  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      selectedImageBase64 = reader.result.split(",")[1]; // strip data: prefix
      preview.src = reader.result;
      preview.style.display = "block";
      askBtn.disabled = false;
      statusEl.textContent = "Photo ready. Double-tap \"Describe This\" when ready.";
    };
    reader.readAsDataURL(file);
  });

  askBtn.addEventListener("click", async () => {
    if (!selectedImageBase64) return;

    askBtn.disabled = true;
    resultsEl.innerHTML = "";
    statusEl.textContent = "Thinking…";

    try {
      const response = await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          image: selectedImageBase64,
          question: questionInput.value || null
        })
      });

      if (!response.ok) {
        throw new Error("Server returned " + response.status);
      }

      const data = await response.json();
      renderResults(data);
    } catch (err) {
      statusEl.textContent = "Something went wrong — please try again.";
      speak("Something went wrong. Please try again.");
      console.error(err);
    } finally {
      askBtn.disabled = false;
    }
  });

  function renderResults(data) {
    statusEl.textContent = "";

    const seeing = data.whatICanSee || data.seeing || "";
    const needsCloser = data.needsCloserPhoto || data.closer || "";
    const suggestion = data.suggestion || "";

    let html = "";
    let spokenParts = [];

    if (seeing) {
      html += block("What I can see", seeing, "");
      spokenParts.push(seeing);
    }
    if (needsCloser) {
      html += block("Needs a closer photo", needsCloser, "needs-closer");
      spokenParts.push("I need a closer photo to check: " + needsCloser);
    }
    if (suggestion) {
      html += block("Suggestion", suggestion, "suggestion");
      spokenParts.push(suggestion);
    }

    if (!html) {
      html = block("Result", "No description was returned.", "");
      spokenParts.push("No description was returned.");
    }

    resultsEl.innerHTML = html;
    speak(spokenParts.join(". "));
  }

  function block(title, text, extraClass) {
    return (
      '<div class="result-block ' + extraClass + '">' +
      "<h2>" + title + "</h2>" +
      "<p>" + escapeHtml(text) + "</p>" +
      "</div>"
    );
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function speak(text) {
    if (!text) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  }
</script>

</body>
</html>
