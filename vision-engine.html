<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go Personal</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px 18px 60px;
  background: #10151f;
  color: #f2f3f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  max-width: 760px;
  margin: auto;
}

h1 {
  margin-bottom: 8px;
}

p {
  line-height: 1.5;
}

button,
input,
label {
  font-size: 18px;
}

.action {
  display: block;
  width: 100%;
  min-height: 60px;
  margin: 24px 0;
  padding: 16px;
  border: 0;
  border-radius: 14px;
  font-weight: 700;
  cursor: pointer;
}

#photoButton {
  background: #6fa287;
  color: #08110d;
}

#describeButton {
  background: #4d8fff;
  color: white;
}

#describeButton:disabled {
  opacity: 0.45;
}

label {
  display: block;
  font-weight: 700;
  margin-top: 30px;
  margin-bottom: 10px;
}

#question {
  width: 100%;
  min-height: 58px;
  padding: 14px;
  border-radius: 12px;
  border: 2px solid #5f6877;
  background: #171d29;
  color: #f2f3f5;
}

#fileInput {
  display: none;
}

#preview {
  display: none;
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  margin-top: 24px;
  border-radius: 14px;
}

#status {
  margin-top: 26px;
  font-size: 18px;
  line-height: 1.5;
}

.result {
  margin-top: 24px;
  padding: 18px;
  background: #171d29;
  border-radius: 14px;
}

.result h2 {
  margin-top: 0;
  font-size: 21px;
}
</style>
</head>

<body>
<main>

<h1>Know N'Go Personal</h1>

<p>Take or choose a photo and Know N'Go will describe what is in front of you.</p>

<button class="action" id="photoButton" type="button">
Take or Choose Photo
</button>

<input
  id="fileInput"
  type="file"
  accept="image/*"
  capture="environment"
>

<img id="preview" alt="Selected photo preview">

<label for="question">
Ask a question about the photo
</label>

<input
  id="question"
  type="text"
  placeholder="Example: What is this?"
>

<button
  class="action"
  id="describeButton"
  type="button"
  disabled
>
Describe This
</button>

<div
  id="status"
  role="status"
  aria-live="polite"
></div>

<div
  id="results"
  aria-live="polite"
></div>

</main>

<script>
const BACKEND_URL =
  "https://see-and-say-server-1.onrender.com/describe";

const photoButton =
  document.getElementById("photoButton");

const fileInput =
  document.getElementById("fileInput");

const preview =
  document.getElementById("preview");

const question =
  document.getElementById("question");

const describeButton =
  document.getElementById("describeButton");

const status =
  document.getElementById("status");

const results =
  document.getElementById("results");

let selectedImageBase64 = null;

photoButton.addEventListener("click", function () {
  fileInput.click();
});

fileInput.addEventListener("change", function () {
  const file = fileInput.files[0];

  if (!file) {
    return;
  }

  const reader = new FileReader();

  reader.onload = function () {
    selectedImageBase64 =
      reader.result.split(",")[1];

    preview.src = reader.result;
    preview.style.display = "block";

    describeButton.disabled = false;

    status.textContent =
      "Photo ready. Double-tap Describe This.";
  };

  reader.readAsDataURL(file);
});

describeButton.addEventListener(
  "click",
  async function () {

    if (!selectedImageBase64) {
      return;
    }

    describeButton.disabled = true;

    results.innerHTML = "";

    status.textContent =
      "Analyzing photo.";

    try {

      const response =
        await fetch(BACKEND_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            image: selectedImageBase64,
            question:
              question.value.trim() || null
          })
        });

      if (!response.ok) {
        throw new Error(
          "Server returned " +
          response.status
        );
      }

      const data =
        await response.json();

      showResults(data);

    } catch (error) {

      status.textContent =
        "Something went wrong. Please try again.";

      speak(
        "Something went wrong. Please try again."
      );

    } finally {

      describeButton.disabled = false;
    }
  }
);

function showResults(data) {

  status.textContent = "";

  const seeing =
    data.whatICanSee ||
    data.seeing ||
    "";

  const closer =
    data.needsCloserPhoto ||
    data.closer ||
    "";

  const suggestion =
    data.suggestion ||
    "";

  let html = "";

  const spoken = [];

  if (seeing) {

    html += makeResult(
      "What I can see",
      seeing
    );

    spoken.push(seeing);
  }

  if (closer) {

    html += makeResult(
      "Needs a closer photo",
      closer
    );

    spoken.push(
      "I need a closer photo to check " +
      closer
    );
  }

  if (suggestion) {

    html += makeResult(
      "Suggestion",
      suggestion
    );

    spoken.push(suggestion);
  }

  if (!html) {

    html = makeResult(
      "Result",
      "No description was returned."
    );

    spoken.push(
      "No description was returned."
    );
  }

  results.innerHTML = html;

  speak(
    spoken.join(". ")
  );
}

function makeResult(title, text) {

  return (
    '<section class="result">' +
    "<h2>" +
    escapeHtml(title) +
    "</h2>" +
    "<p>" +
    escapeHtml(text) +
    "</p>" +
    "</section>"
  );
}

function escapeHtml(text) {

  const element =
    document.createElement("div");

  element.textContent = text;

  return element.innerHTML;
}

function speak(text) {

  if (!text) {
    return;
  }

  window.speechSynthesis.cancel();

  const voice =
    new SpeechSynthesisUtterance(text);

  window.speechSynthesis.speak(voice);
}
</script>

</body>
</html>
