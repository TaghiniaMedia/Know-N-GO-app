<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Know N'Go Personal</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 28px 18px 80px;
  background: #10151f;
  color: #f2f3f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

main {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
}

h1 {
  margin: 0 0 10px;
  font-size: 32px;
  line-height: 1.2;
}

.subtitle {
  margin: 0 0 42px;
  color: #aeb7c5;
  font-size: 18px;
  line-height: 1.5;
}

.section {
  margin-bottom: 38px;
}

button,
input {
  width: 100%;
  min-height: 64px;
  border-radius: 14px;
  font-size: 18px;
  font-family: inherit;
}

button {
  border: none;
  padding: 17px 18px;
  font-weight: 700;
}

.primary {
  background: #78ac90;
  color: #07130d;
}

button:disabled {
  opacity: 0.45;
}

input[type="text"] {
  padding: 14px 16px;
  border: 2px solid #75839a;
  background: #151d29;
  color: #ffffff;
}

input::placeholder {
  color: #adb5c2;
}

label {
  display: block;
  margin-bottom: 14px;
  font-size: 19px;
  font-weight: 700;
}

#photoInput {
  position: absolute;
  left: -10000px;
  top: auto;
  width: 1px;
  height: 1px;
  overflow: hidden;
}

#preview {
  display: none;
  width: 100%;
  max-height: 420px;
  object-fit: contain;
  margin-top: 28px;
  border-radius: 14px;
}

#status {
  min-height: 32px;
  margin: 8px 0 38px;
  color: #d4dae3;
  font-size: 18px;
  line-height: 1.5;
}

#results {
  display: none;
  margin-top: 38px;
  padding: 24px 20px;
  background: #171f2c;
  border-radius: 16px;
  line-height: 1.6;
}

.result-block {
  margin-bottom: 30px;
}

.result-block:last-child {
  margin-bottom: 0;
}

.result-block h2 {
  margin: 0 0 10px;
  font-size: 21px;
}

.result-block p {
  margin: 0;
  font-size: 18px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<main>

<h1>Know N'Go Personal</h1>

<p class="subtitle">
Snap or choose a photo, ask a question, and get a clear answer.
</p>

<div class="section">

<button
  id="photoButton"
  class="primary"
  type="button"
  aria-label="Take or choose a photo">
  Take or Choose Photo
</button>

<input
  id="photoInput"
  type="file"
  accept="image/*">

<img
  id="preview"
  alt="Selected photo">

</div>

<div class="section">

<label for="question">
What would you like to know?
</label>

<input
  id="question"
  type="text"
  autocomplete="off"
  placeholder="Example: What is this?">

</div>

<div
  id="status"
  role="status"
  aria-live="polite"
  aria-atomic="true">
Choose or take a photo to begin.
</div>

<div class="section">

<button
  id="describeButton"
  class="primary"
  type="button"
  disabled
  aria-disabled="true">
Describe This
</button>

</div>

<div
  id="results"
  role="region"
  aria-label="Know N'Go results"
  aria-live="polite"
  tabindex="-1">

<div
  id="descriptionBlock"
  class="result-block"
  hidden>
<h2>What I can see</h2>
<p id="description"></p>
</div>

<div
  id="answerBlock"
  class="result-block"
  hidden>
<h2>Answer</h2>
<p id="answer"></p>
</div>

<div
  id="warningBlock"
  class="result-block"
  hidden>
<h2>Heads up</h2>
<p id="warning"></p>
</div>

<div
  id="closerBlock"
  class="result-block"
  hidden>
<h2>Needs a closer photo</h2>
<p id="closer"></p>
</div>

<div
  id="suggestionBlock"
  class="result-block"
  hidden>
<h2>Suggestion</h2>
<p id="suggestion"></p>
</div>

</div>

</main>

<script>

const API_URL =
"https://see-and-say-server.onrender.com/describe";

const photoButton =
document.getElementById("photoButton");

const photoInput =
document.getElementById("photoInput");

const question =
document.getElementById("question");

const describeButton =
document.getElementById("describeButton");

const status =
document.getElementById("status");

const preview =
document.getElementById("preview");

const results =
document.getElementById("results");

let selectedImage = "";
let selectedMediaType = "image/jpeg";

photoButton.addEventListener("click", function () {

  photoInput.value = "";

  photoInput.click();

});

photoInput.addEventListener(
"change",
async function () {

  const file =
  photoInput.files &&
  photoInput.files[0];

  if (!file) {

    status.textContent =
    "No photo was selected.";

    return;

  }

  if (!file.type.startsWith("image/")) {

    status.textContent =
    "Please select a photo.";

    return;

  }

  status.textContent =
  "Preparing your photo.";

  try {

    selectedMediaType =
    file.type || "image/jpeg";

    const dataUrl =
    await readFile(file);

    selectedImage =
    dataUrl.split(",")[1];

    preview.src =
    dataUrl;

    preview.style.display =
    "block";

    describeButton.disabled =
    false;

    describeButton.setAttribute(
    "aria-disabled",
    "false"
    );

    clearResults();

    status.textContent =
    "Photo ready. You can ask a question, then double-tap Describe This.";

  } catch (error) {

    selectedImage = "";

    describeButton.disabled =
    true;

    describeButton.setAttribute(
    "aria-disabled",
    "true"
    );

    status.textContent =
    "I could not prepare that photo. Please try another photo.";

  }

});

function readFile(file) {

  return new Promise(
  function (resolve, reject) {

    const reader =
    new FileReader();

    reader.onload =
    function () {
      resolve(reader.result);
    };

    reader.onerror =
    function () {
      reject(reader.error);
    };

    reader.readAsDataURL(file);

  });

}
